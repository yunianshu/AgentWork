function getTypeClass(t) {
  if (t === '判断题') return 'judge';
  if (t === '单选题') return 'single';
  return 'multi';
}

function getTypeLabel(t) {
  if (t === '判断题') return '判断题';
  if (t === '单选题') return '单选题';
  return '不定项';
}

function renderChangeCard(item) {
  const typeCls = getTypeClass(item.type);
  const typeLbl = getTypeLabel(item.type);

  let optionsHtml = '';
  if (item.options && item.options.length > 0) {
    const labels = ['A','B','C','D','E','F'];
    optionsHtml = '<ul class="options-list">' + item.options.map((opt, i) => {
      const label = labels[i] || String.fromCharCode(65+i);
      return '<li><span class="opt-label">' + label + '</span>' + opt + '</li>';
    }).join('') + '</ul>';
  }

  return '<div class="card" data-type="' + item.type + '">' +
    '<div class="card-header">' +
      '<span class="q-number">Q' + item.num + '</span>' +
      '<span class="q-type ' + typeCls + '">' + typeLbl + '</span>' +
    '</div>' +
    '<div class="q-content">' + item.content + '</div>' +
    optionsHtml +
    '<div class="answer-change">' +
      '<span class="answer-old">' + item.old + '</span>' +
      '<span class="arrow">&#8594;</span>' +
      '<span class="answer-new">' + item.new + '</span>' +
    '</div>' +
  '</div>';
}

function renderAddedCard(item) {
  const typeCls = getTypeClass(item.type);
  const typeLbl = getTypeLabel(item.type);
  const labels = ['A','B','C','D','E','F'];
  const optionsHtml = '<ul class="options-list">' + item.options.map((opt, i) => {
    const label = labels[i] || String.fromCharCode(65+i);
    const isCorrect = item.answer.includes(label);
    return '<li><span class="opt-label ' + (isCorrect ? 'correct' : '') + '">' + label + '</span>' + opt + '</li>';
  }).join('') + '</ul>';

  return '<div class="card">' +
    '<div class="card-header">' +
      '<span class="q-number">Q' + item.num + '</span>' +
      '<span class="q-type ' + typeCls + '">' + typeLbl + '</span>' +
      '<span class="added-badge">新增</span>' +
    '</div>' +
    '<div class="q-content">' + item.content + '</div>' +
    optionsHtml +
    '<div class="answer-change">' +
      '<span class="answer-new">答案：' + item.answer + '</span>' +
    '</div>' +
  '</div>';
}

function updateStats() {
  document.getElementById('stat-changes').textContent = changesData.length;
  document.getElementById('stat-added').textContent = addedData.length;
  document.getElementById('stat-judge').textContent = changesData.filter(c => c.type === '判断题').length;
  document.getElementById('stat-single').textContent = changesData.filter(c => c.type === '单选题').length;
  document.getElementById('stat-multi').textContent = changesData.filter(c => c.type === '不定项选择题').length;
}

function renderAll() {
  const changesList = document.getElementById('changes-list');
  const addedList = document.getElementById('added-list');

  changesList.innerHTML = changesData.map(renderChangeCard).join('');
  addedList.innerHTML = addedData.map(renderAddedCard).join('');
}

function filter(type) {
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.filter === type);
  });

  const cards = document.querySelectorAll('#changes-list .card');
  cards.forEach(card => {
    if (type === 'all' || card.dataset.type === type) {
      card.classList.remove('hidden');
    } else {
      card.classList.add('hidden');
    }
  });
}

updateStats();
renderAll();
</script>
